<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>

</head>
<body>
    <div class="screen">
        <div class="container"></div>
        <div class="options">
            <h1 class="heading">welcome to etch-a-sketch!</h1> 
            <div>click on the canvas to start drawing!</div>
            <div class="choices">
                <button class="color">choose color</button>
                <button class="reset">reset</button>
                
                
                <!-- <button class="rand">randomize color</button> -->
                <button class="grd">show grid</button>
                
            </div>
            <h3>choose drawing mode</h3>
            <div class="modes">   
                <button class="pen">pen</button>       
                <button class="pencil">pencil</button>
                <button class="chalk">chalk</button>
                               

            </div>
            <h3>featured colors</h3>
            <div class="pallete">


            </div>
            <div class="penmode">
                <div>PEN: </div>
                <div class="status">DISABLED</div>
            </div>
        </div>
    </div>
    
    
</body>
</html>
